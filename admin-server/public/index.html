<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CHING'S PROFILE — 後台管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..600;1,400..600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="brand">Ching's Profile <em>後台管理</em></span>
      <nav class="tabs">
        <button class="tab-btn active" data-tab="photos">攝影</button>
        <button class="tab-btn" data-tab="videos">影片</button>
        <button class="tab-btn" data-tab="text">文字內容</button>
      </nav>
      <span id="sync-indicator" class="sync-indicator"></span>
    </header>

    <main>
      <section id="panel-photos" class="panel active">
        <!-- 分類列表 -->
        <div id="category-list-view">
          <button id="new-category-btn" class="primary-btn">＋ 新增分類</button>

          <form id="category-form" class="upload-form" style="display: none">
            <div class="fields">
              <label>中文名稱 <input type="text" name="name_zh" placeholder="例如：人像" required /></label>
              <label>English Name <input type="text" name="name_en" placeholder="e.g. Portrait" /></label>
              <label>中文說明 <input type="text" name="description_zh" placeholder="這個分類的簡短說明" /></label>
              <label>English Description <input type="text" name="description_en" /></label>
              <label>中文地點 <input type="text" name="location_zh" placeholder="例如：台北" /></label>
              <label>English Location <input type="text" name="location_en" /></label>
            </div>
            <button type="submit" class="primary-btn">建立分類</button>
            <button type="button" id="cancel-category-btn" class="cover-btn">取消</button>
            <p class="status" id="category-status"></p>
          </form>

          <div id="category-grid" class="grid"></div>
        </div>

        <!-- 分類內部：管理說明/地點 + 照片 -->
        <div id="category-detail-view" style="display: none">
          <button id="back-to-categories-btn" class="cover-btn">← 返回分類列表</button>

          <div class="upload-form">
            <div class="fields">
              <label>中文名稱 <input type="text" data-cat-field="name_zh" /></label>
              <label>English Name <input type="text" data-cat-field="name_en" /></label>
              <label>中文說明 <input type="text" data-cat-field="description_zh" /></label>
              <label>English Description <input type="text" data-cat-field="description_en" /></label>
              <label>中文地點 <input type="text" data-cat-field="location_zh" /></label>
              <label>English Location <input type="text" data-cat-field="location_en" /></label>
            </div>
            <button type="button" id="delete-category-btn" class="delete-btn">刪除這個分類</button>
          </div>

          <form id="photo-form" class="upload-form">
            <div id="photo-drop" class="dropzone">
              <p>拖拉多張照片到這裡，或點擊選擇檔案（可一次選很多張）</p>
              <input type="file" id="photo-file" accept="image/*" multiple hidden />
              <p id="photo-filename" class="filename"></p>
            </div>
            <button type="submit" class="primary-btn">上傳照片</button>
            <p class="status" id="photo-status"></p>
          </form>

          <div id="photo-grid" class="grid"></div>
        </div>
      </section>

      <section id="panel-videos" class="panel">
        <form id="video-form" class="upload-form">
          <div id="video-drop" class="dropzone">
            <p>拖拉影片到這裡，或點擊選擇檔案</p>
            <input type="file" id="video-file" accept="video/*" hidden />
            <p id="video-filename" class="filename"></p>
          </div>
          <div class="fields">
            <label>中文標題 <input type="text" name="title_zh" placeholder="例如：品牌形象片" /></label>
            <label>English Title <input type="text" name="title_en" placeholder="e.g. Brand Film" /></label>
            <label>服務內容（中） <input type="text" name="services_zh" placeholder="企劃・攝影・剪輯" /></label>
            <label>Services (EN) <input type="text" name="services_en" placeholder="Planning · Shooting · Editing" /></label>
            <label>年份 Year <input type="text" name="year" placeholder="2026" /></label>
          </div>
          <p class="hint">上傳後會自動用 ffmpeg 擷取縮圖，可能需要幾秒鐘。</p>
          <button type="submit" class="primary-btn">上傳影片</button>
          <p class="status" id="video-status"></p>
        </form>

        <div id="video-grid" class="grid"></div>
      </section>

      <section id="panel-text" class="panel">
        <p class="hint">網站上會顯示的文字，中英文分開編輯，改完點別的地方就會自動存檔。</p>
        <div id="text-sections"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
